<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Steam 收藏集分组 · 界面风格稿（原型）</title>
<!--
  PROTOTYPE / 一次性设计稿，不是生产代码。
  要回答的问题：这个工具的主界面，哪一种信息结构最顺手？
  五版共用同一份真实数据，但布局、信息层级、主要操作位置都不同。
  切换：?variant=a|b|c|d|e ；并排对比：&mode=grid
  选定后应把胜出版重写进 steam_source_collections/gui_page.html，本文件不进主界面。
-->
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#0b0e13;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid #57a8ff;outline-offset:2px}
svg.ic{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
#stage{min-height:100vh}
.v-a,.v-b,.v-c,.v-d,.v-e{width:100%;min-height:100vh;overflow:hidden}

/* ---------- 原型工具条：刻意做成高对比胶囊，不属于任何一版设计 ---------- */
.proto-bar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:999;
  display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:999px;
  background:#0d1117;border:1px solid #3a4557;box-shadow:0 12px 34px rgba(0,0,0,.55);
  color:#e8eef8;font-size:12.5px;max-width:calc(100vw - 24px)}
.proto-bar button{background:#1b2432;color:#e8eef8;border:1px solid #37445a;border-radius:999px;
  min-width:36px;height:36px;padding:0 11px;font-size:13px;transition:background .15s}
.proto-bar button:hover{background:#2b3950}
.proto-bar button.on{background:#3b82f6;border-color:#3b82f6;color:#fff}
.pb-label{min-width:210px;max-width:330px;line-height:1.25;padding:0 6px}
.pb-label b{display:block;font-size:13px;letter-spacing:.2px}
.pb-label span{display:block;color:#93a3bb;font-size:11px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pb-sep{width:1px;height:26px;background:#37445a}
#toast{position:fixed;left:50%;bottom:78px;transform:translateX(-50%) translateY(8px);z-index:1000;
  background:#111827;color:#f3f6fc;border:1px solid #46536a;border-radius:10px;padding:10px 16px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;box-shadow:0 10px 28px rgba(0,0,0,.4)}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
#gridView{display:none;gap:16px;padding:26px 22px 110px;grid-template-columns:repeat(auto-fit,minmax(330px,1fr))}
#gridView.on{display:grid}
.mini{background:#121722;border:1px solid #2c3749;border-radius:14px;overflow:hidden;position:relative}
.mini-inner{width:1120px;transform-origin:top left;pointer-events:none}
.mini{height:390px}
.mini::after{content:"";position:absolute;left:0;right:0;bottom:0;height:56px;
  background:linear-gradient(transparent,rgba(10,14,20,.86));pointer-events:none}
.mini-cap{position:absolute;left:0;right:0;bottom:0;z-index:2;display:flex;justify-content:space-between;
  align-items:center;gap:8px;padding:10px 14px;color:#eaf0fa;font-size:12.5px;font-weight:600}
.mini-cap span{color:#8ea0bb;font-weight:400;font-size:11px}
.mini[data-goto]{cursor:pointer}
.mini[data-goto]:hover{border-color:#5b8def}
#gridView.on ~ .proto-bar .pb-label{min-width:150px}
@media(max-width:640px){.pb-label{min-width:120px}.pb-label span{display:none}.proto-bar{gap:5px}}

/* ================= A · 熟悉的两步式（基准精修） ================= */
.v-a{--bg:#f4f7fc;--card:#fff;--surface:#f7f9fd;--ink:#12203a;--muted:#63718c;--line:#e3e9f3;
  --blue:#2563eb;--blue2:#3b74f5;--green:#0f9d6e;--green2:#12b27c;--soft:#eaf1ff;--amber:#fff5e3;
  background:var(--bg);color:var(--ink);font-size:15px;line-height:1.6}
.v-a .top{background:linear-gradient(120deg,#eaf1ff,#f7faff 55%,#fff);border-bottom:1px solid var(--line);padding:24px 0}
.v-a .top-in{max-width:980px;margin:auto;padding:0 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.v-a .logo{width:44px;height:44px;border-radius:12px;background:linear-gradient(145deg,var(--blue),var(--blue2));
  color:#fff;display:grid;place-items:center;box-shadow:0 6px 16px rgba(37,99,235,.25)}
.v-a .logo svg{width:23px;height:23px}
.v-a h1{margin:0;font-size:21px;letter-spacing:.3px}
.v-a .sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.v-a .badge{margin-left:auto;background:#fff;border:1px solid var(--line);border-radius:999px;
  padding:7px 14px;font-size:12.5px;color:#0a6c4c;display:flex;align-items:center;gap:7px}
.v-a .badge i{width:8px;height:8px;border-radius:50%;background:#12b27c;display:inline-block}
.v-a .wrap{max-width:980px;margin:auto;padding:22px 24px 100px}
.v-a .card{background:var(--card);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 8px 28px rgba(24,51,94,.07);padding:22px 24px;margin-bottom:16px}
.v-a .card h2{margin:0 0 5px;font-size:17px;display:flex;align-items:center;gap:9px}
.v-a .num{width:24px;height:24px;border-radius:8px;background:var(--soft);color:var(--blue);
  font-size:13px;display:grid;place-items:center;font-weight:700;flex:none}
.v-a .lead{color:var(--muted);font-size:13px;margin:0 0 16px}
.v-a .stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-bottom:16px}
.v-a .stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.v-a .stat .t{font-size:11.5px;color:var(--muted)}
.v-a .stat .val{font-size:14px;font-weight:650;margin-top:4px;display:flex;gap:6px;align-items:center}
.v-a .stat .val svg{color:var(--green)}
.v-a .big{width:100%;min-height:56px;border:0;border-radius:13px;color:#fff;font-size:16px;font-weight:650;
  display:flex;align-items:center;justify-content:center;gap:9px;transition:filter .16s,transform .16s}
.v-a .big:hover{filter:brightness(1.08);transform:translateY(-1px)}
.v-a .big.blue{background:linear-gradient(110deg,var(--blue),var(--blue2));box-shadow:0 9px 20px rgba(37,99,235,.2)}
.v-a .big.green{background:linear-gradient(110deg,var(--green),var(--green2));box-shadow:0 9px 20px rgba(15,157,110,.18)}
.v-a .row{display:flex;gap:9px;flex-wrap:wrap;margin-top:11px}
.v-a .small{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 12px;
  font-size:12.5px;color:var(--ink);min-height:38px}
.v-a .small:hover{border-color:var(--blue);color:var(--blue)}
.v-a .groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:11px;margin-top:14px}
.v-a .group{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:13px 15px;min-width:0}
.v-a .group .n{font-size:25px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.v-a .group .l{font-size:12.5px;font-weight:600;margin-top:1px;overflow-wrap:anywhere}
.v-a .group .s{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.v-a .group.unknown{background:#fbf8f1;border-color:#f0e4c8}
.v-a .note{background:var(--amber);color:#8a5a0a;border-radius:11px;padding:11px 14px;font-size:12.5px;margin-top:13px}
.v-a .note.ok{background:#e6f8f1;color:#0a6c4c}
.v-a .foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;color:var(--muted);font-size:12px;padding:4px 2px}
@media(max-width:700px){.v-a .stats,.v-a .groups{grid-template-columns:repeat(2,minmax(0,1fr))}.v-a .badge{margin-left:0}}

/* ================= B · Steam 客户端风（侧栏 + 记录条） ================= */
.v-b{--ink:#c7d5e0;--dim:#8ba2b8;--nav:#0d141e;--panel:#162231;--panel2:#1b2b3e;
  --line:#2a3d52;--blue:#66c0f4;--blue2:#1a9fff;--green:#5ba32b;
  background:#0e1622;color:var(--ink);font-size:14px;line-height:1.55;
  display:grid;grid-template-columns:216px minmax(0,1fr)}
.v-b .side{background:var(--nav);border-right:1px solid #22303f;padding:18px 12px;display:flex;flex-direction:column;gap:3px}
.v-b .brand{font-size:11px;letter-spacing:.16em;color:#6f8ba4;padding:4px 10px 14px;text-transform:uppercase}
.v-b .nav{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:5px;font-size:13px;color:#9db3c8}
.v-b .nav.cur{background:linear-gradient(90deg,rgba(102,192,244,.2),rgba(102,192,244,.03));color:#e6f3ff;
  box-shadow:inset 3px 0 0 var(--blue)}
.v-b .nav .tag{margin-left:auto;font-size:10.5px;background:#22384f;border-radius:9px;padding:1px 7px;color:#9fc4e0}
.v-b .side-foot{margin-top:auto;border-top:1px solid #22303f;padding:13px 10px 0;font-size:11.5px;color:#6f8ba4}
.v-b .side-foot b{display:block;color:#a9c2d8;font-size:12.5px;font-weight:600;margin-bottom:3px}
.v-b .main{min-width:0;display:flex;flex-direction:column}
.v-b .topbar{background:linear-gradient(100deg,#1b2838,#2a475e 70%,#1e3a52);padding:14px 26px;
  display:flex;align-items:center;gap:14px;border-bottom:1px solid #31485e}
.v-b .crumb{font-size:12.5px;color:#9fc0d8}
.v-b .crumb b{color:#fff;font-weight:600}
.v-b .search{margin-left:auto;background:rgba(9,17,26,.5);border:1px solid #3c5871;border-radius:4px;
  padding:6px 11px;color:#8ba2b8;font-size:12px;display:flex;align-items:center;gap:7px;min-width:180px}
.v-b .avatar{width:28px;height:28px;border-radius:4px;background:#3a6a8f;display:grid;place-items:center;color:#dff0ff;font-size:12px}
.v-b .content{padding:24px 28px 10px;min-width:0}
.v-b .hero{background:linear-gradient(100deg,#1e3b52,#20364b 60%,#182a3c);border:1px solid #35516a;
  border-radius:4px;padding:20px 24px;display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.v-b .hero h1{margin:0 0 4px;font-size:20px;color:#fff;font-weight:600}
.v-b .hero p{margin:0;color:#a9c3d8;font-size:12.5px}
.v-b .hero .total{margin-left:auto;text-align:right}
.v-b .hero .total b{display:block;font-size:32px;color:var(--blue);line-height:1;font-variant-numeric:tabular-nums}
.v-b .hero .total span{font-size:11px;color:#9db7cd;letter-spacing:.08em}
.v-b .sec-h{display:flex;align-items:baseline;gap:10px;margin:24px 0 10px}
.v-b .sec-h h2{margin:0;font-size:14px;color:#e8f2fb;font-weight:600}
.v-b .sec-h span{font-size:11.5px;color:#7d97ae}
.v-b .rows{border:1px solid var(--line);border-radius:4px;overflow:hidden}
.v-b .r{display:grid;grid-template-columns:minmax(150px,1.1fr) 72px minmax(90px,1fr) 62px;gap:12px;align-items:center;
  padding:10px 14px;background:var(--panel);border-bottom:1px solid #233446;font-size:12.5px}
.v-b .r:last-child{border-bottom:0}
.v-b .r:nth-child(even){background:#172534}
.v-b .r .nm{display:flex;align-items:center;gap:9px;min-width:0;overflow-wrap:anywhere}
.v-b .r .nm i{width:7px;height:7px;border-radius:2px;background:var(--blue);flex:none}
.v-b .r .ct{text-align:right;font-variant-numeric:tabular-nums;font-weight:600;color:#e6f2fb}
.v-b .r .bar{height:7px;background:#233548;border-radius:4px;overflow:hidden}
.v-b .r .bar i{display:block;height:100%;background:linear-gradient(90deg,var(--blue2),var(--blue));border-radius:4px}
.v-b .r .pc{text-align:right;color:#8fa9c0;font-variant-numeric:tabular-nums}
.v-b .r.unknown .nm i{background:#c8a24a}.v-b .r.unknown .bar i{background:#c8a24a}
.v-b .tip{background:#1d2e3e;border-left:3px solid #c8a24a;padding:10px 13px;margin-top:12px;
  font-size:12px;color:#c3d4e3;border-radius:0 4px 4px 0}
.v-b .action{position:sticky;bottom:0;background:rgba(13,20,30,.97);border-top:1px solid #2b3f54;
  padding:12px 28px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px}
.v-b .action .info{font-size:11.5px;color:#8ba2b8;margin-right:auto}
.v-b .abtn{border:0;border-radius:3px;padding:10px 18px;font-size:13px;font-weight:600;min-height:42px;
  display:flex;align-items:center;gap:8px;color:#fff;transition:filter .15s}
.v-b .abtn:hover{filter:brightness(1.15)}
.v-b .abtn.b1{background:linear-gradient(100deg,#1a9fff,#47b5ff)}
.v-b .abtn.b2{background:linear-gradient(100deg,#5ba32b,#79c13f)}
.v-b .abtn.ghost{background:transparent;border:1px solid #3d5469;color:#a9c2d8;font-weight:400}
@media(max-width:820px){.v-b{grid-template-columns:1fr}.v-b .side{display:none}
  .v-b .r{grid-template-columns:minmax(110px,1fr) 60px minmax(60px,.7fr) 50px}}

/* ================= C · 工业控制台（endfield-ui / coldstore 变体） ================= */
.v-c{--paper:#f1f4f4;--panel:#fff;--ink:#161616;--ink2:#5c5c5c;--rule:#d5dcdc;--chip:#e5ecec;
  --signal:#7de6ff;--danger:#b3261e;--cmd:#161616;
  background:var(--paper);color:var(--ink);font-size:14px;line-height:1.55;
  font-family:"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.v-c .cmd{background:var(--cmd);color:#ededed;min-height:52px;display:flex;align-items:center;
  flex-wrap:wrap;row-gap:6px;padding:8px 24px;gap:10px 22px;font-size:12px;letter-spacing:.14em;text-transform:uppercase}
.v-c .cmd .home{font-weight:800;letter-spacing:.2em;font-size:13px;color:#fff}
.v-c .cmd .sep{width:1px;height:20px;background:#3b3b3b}
.v-c .cmd .cur{background:var(--signal);color:#161616;padding:5px 12px;font-weight:800;letter-spacing:.1em}
.v-c .cmd .right{margin-left:auto;display:flex;gap:18px;color:#a3a3a3;font-variant-numeric:tabular-nums}
.v-c .tri{height:3px;display:flex;background:#161616}
.v-c .tri i{flex:1}.v-c .tri i:nth-child(1){background:#ff00f0}
.v-c .tri i:nth-child(2){background:var(--signal)}.v-c .tri i:nth-child(3){background:#9df5c4}
.v-c .body{max-width:1120px;margin:auto;padding:26px 24px 100px;
  background-image:linear-gradient(rgba(22,22,22,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(22,22,22,.035) 1px,transparent 1px);
  background-size:28px 28px}
.v-c .eyebrow{font-size:11px;font-weight:800;letter-spacing:.16em;color:var(--ink2);text-transform:uppercase}
.v-c h2{font-size:23px;font-weight:800;letter-spacing:-.01em;margin:2px 0 0}
.v-c .field{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--ink2);letter-spacing:.06em;margin-top:6px}
.v-c .sec{margin-top:30px;border-top:1px solid var(--rule);padding-top:14px}
.v-c .sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:14px}
.v-c .boards{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:10px}
.v-c .board{position:relative;background:var(--panel);border:1px solid var(--ink);padding:14px 16px 16px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%)}
.v-c .board::before{content:"";position:absolute;left:0;top:0;width:56px;height:5px;background:var(--ink)}
.v-c .board .lab{font-size:11px;letter-spacing:.1em;color:var(--ink2);font-weight:700;text-transform:uppercase}
.v-c .board .val{font-size:34px;font-weight:850;line-height:1.1;margin-top:8px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.v-c .board .sub{font-size:11.5px;color:var(--ink2);margin-top:2px}
.v-c .board.b1{grid-column:span 4}.v-c .board.b2{grid-column:span 3}
.v-c .board.b3{grid-column:span 3}.v-c .board.b4{grid-column:span 2}
.v-c .board.b5{grid-column:span 4}.v-c .board.b6{grid-column:span 4}
.v-c .board.b6 .val{background:var(--signal);display:inline-block;padding:0 8px}
.v-c .recs{border-top:1px solid var(--ink);border-bottom:1px solid var(--rule)}
.v-c .rec{display:grid;grid-template-columns:66px minmax(0,1fr) 90px 118px;gap:10px;align-items:center;
  padding:11px 4px;border-bottom:1px solid var(--rule);font-size:13px;transition:transform .18s cubic-bezier(.16,1,.3,1)}
.v-c .rec:last-child{border-bottom:0}
.v-c .rec:hover{transform:translateX(6px);box-shadow:inset 3px 0 0 var(--signal)}
.v-c .rec .no{font-size:11px;font-weight:800;letter-spacing:.1em;font-variant-numeric:tabular-nums}
.v-c .rec .nm{font-weight:700;min-width:0;overflow-wrap:anywhere}
.v-c .rec .ct{text-align:right;font-weight:800;font-size:17px;font-variant-numeric:tabular-nums}
.v-c .rec .pc{text-align:right;color:var(--ink2);font-size:11.5px;font-variant-numeric:tabular-nums}
.v-c .rec.warn .ct{background:var(--signal);padding:0 6px;justify-self:end}
.v-c .flag{background:var(--panel);border:1px solid var(--rule);padding:11px 14px;margin-top:12px;font-size:12.5px;
  display:flex;gap:10px;align-items:flex-start}
.v-c .flag::before{content:"";width:9px;height:13px;background:var(--signal);flex:none;margin-top:3px}
.v-c .btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
.v-c .btn{position:relative;overflow:hidden;background:var(--ink);color:#fff;border:0;padding:13px 24px;
  font-size:13.5px;font-weight:800;letter-spacing:.04em;min-height:46px;
  clip-path:polygon(0 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%);transition:color .22s cubic-bezier(.7,0,.2,1)}
.v-c .btn::before{content:"";position:absolute;inset:0;background:var(--signal);transform:scaleX(0);transform-origin:left;
  transition:transform .28s cubic-bezier(.7,0,.2,1);z-index:0}
.v-c .btn span{position:relative;z-index:1}
.v-c .btn:hover{color:var(--ink)}.v-c .btn:hover::before{transform:scaleX(1)}
.v-c .btn.ghost{background:var(--chip);color:var(--ink)}
.v-c .btn.ghost:hover{background:var(--signal)}
.v-c .btn.del{background:var(--danger)}
.v-c .foot{border-top:1px solid var(--rule);margin-top:30px;padding-top:12px;
  font-size:11.5px;color:var(--ink2);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
@media(max-width:760px){.v-c .boards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .v-c .board.b1,.v-c .board.b2,.v-c .board.b3,.v-c .board.b4,.v-c .board.b5,.v-c .board.b6{grid-column:span 1}
  .v-c .rec{grid-template-columns:52px minmax(0,1fr) 70px}.v-c .rec .pc{display:none}
  .v-c .cmd .right{display:none}.v-c .cmd{gap:8px 14px;padding:8px 16px}.v-c .cur{padding:5px 9px}}

/* ================= D · 玻璃拟态仪表盘 ================= */
.v-d{--glass:rgba(255,255,255,.11);--stroke:rgba(255,255,255,.2);--txt:#f2f7ff;--dim:#b7c7df;
  position:relative;color:var(--txt);font-size:14px;line-height:1.6;
  background:linear-gradient(140deg,#0b1226 0%,#13203c 42%,#0e1b33 100%);min-height:100vh}
.v-d .orb{position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none}
.v-d .orb.a{width:420px;height:420px;background:#2563eb;opacity:.42;top:-120px;left:-80px}
.v-d .orb.b{width:380px;height:380px;background:#0ea5a4;opacity:.32;top:150px;right:-110px}
.v-d .orb.c{width:320px;height:320px;background:#7c3aed;opacity:.3;bottom:-140px;left:38%}
.v-d .shell{position:relative;max-width:1080px;margin:auto;padding:28px 26px 105px}
.v-d .glass{background:var(--glass);border:1px solid var(--stroke);border-radius:20px;

<div class="proto-bar" role="toolbar" aria-label="界面风格稿切换">
  <button id="prev" aria-label="上一版">←</button>
  <div class="pb-label"><b id="pbName"></b><span id="pbDesc"></span></div>
  <button id="next" aria-label="下一版">→</button>
  <div class="pb-sep"></div>
  <button id="gridBtn" title="并排对比五版">⊞ 对比</button>
  <button id="helpBtn" title="这是什么">?</button>
</div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
"use strict";
/* PROTOTYPE switcher — throwaway, no state persistence beyond the URL */
const VARIANTS=[
  {k:"a",name:"A · 熟悉的两步式",desc:"现有界面精修：垂直卡片流、两个大按钮，改动最小"},
  {k:"b",name:"B · Steam 客户端风",desc:"左侧栏 + 占比记录条 + 底部固定操作条，最像 Steam"},
  {k:"c",name:"C · 工业控制台",desc:"终末地风格：命令栏、大数字看板、细线记录，零圆角"},
  {k:"d",name:"D · 玻璃拟态仪表盘",desc:"中央主操作 + 环形进度 + 磨砂玻璃卡，视觉最抢眼"},
  {k:"e",name:"E · 极简纸刊",desc:"单栏阅读式、表格明细、文字按钮，最安静"}
];
const KEYS=VARIANTS.map(v=>v.k);
const qs=new URLSearchParams(location.search);
let current=KEYS.includes(qs.get("variant"))?qs.get("variant"):"a";
let mode=qs.get("mode")==="grid"?"grid":"single";
const stage=document.getElementById("stage"), gridView=document.getElementById("gridView");
const pbName=document.getElementById("pbName"), pbDesc=document.getElementById("pbDesc");
const gridBtn=document.getElementById("gridBtn"), toastEl=document.getElementById("toast");
let toastTimer=0;

function toast(msg){
  toastEl.textContent=msg;toastEl.classList.add("on");
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove("on"),2200);
}
function syncURL(){
  try{history.replaceState(null,"",location.pathname+"?variant="+current+(mode==="grid"?"&mode=grid":""));}catch(e){/* file:// */}
}
function fitMinis(){
  document.querySelectorAll(".mini").forEach(cell=>{
    const inner=cell.querySelector(".mini-inner");
    if(inner){const w=cell.clientWidth||360;inner.style.transform="scale("+(w/1120)+")";}
  });
}
function render(){
  syncURL();
  gridBtn.classList.toggle("on",mode==="grid");
  if(mode==="grid"){
    stage.style.display="none";gridView.classList.add("on");gridView.innerHTML="";
    VARIANTS.forEach(v=>{
      const cell=document.createElement("div");
      cell.className="mini";cell.dataset.goto=v.k;cell.setAttribute("tabindex","0");
      cell.setAttribute("role","button");cell.setAttribute("aria-label","查看 "+v.name);
      const inner=document.createElement("div");inner.className="mini-inner";
      inner.appendChild(document.getElementById("tpl-"+v.k).content.cloneNode(true));
      const cap=document.createElement("div");cap.className="mini-cap";
      cap.innerHTML="<div>"+v.name+"</div><span>点击放大 →</span>";
      cell.append(inner,cap);gridView.appendChild(cell);
    });
    pbName.textContent="并排对比 · 5 版";
    pbDesc.textContent="点任意卡片进入单版，或用 ← → 切换";
    requestAnimationFrame(fitMinis);
    return;
  }
  stage.style.display="";gridView.classList.remove("on");gridView.innerHTML="";
  stage.innerHTML="";
  stage.appendChild(document.getElementById("tpl-"+current).content.cloneNode(true));
  const v=VARIANTS[KEYS.indexOf(current)];
  pbName.textContent=v.name+"  ("+(KEYS.indexOf(current)+1)+"/"+VARIANTS.length+")";
  pbDesc.textContent=v.desc;
  window.scrollTo(0,0);
}
function setVariant(k,nextMode){
  current=k;mode=nextMode||"single";render();
}
function step(delta){
  const i=KEYS.indexOf(current);
  setVariant(KEYS[(i+delta+VARIANTS.length)%VARIANTS.length],"single");
}
document.getElementById("prev").addEventListener("click",()=>step(-1));
document.getElementById("next").addEventListener("click",()=>step(1));
gridBtn.addEventListener("click",()=>{mode=mode==="grid"?"single":"grid";render();});
document.getElementById("helpBtn").addEventListener("click",()=>{
  toast("这是一次性设计稿：只换界面结构，不连 Steam、不会写入任何数据");
});
document.addEventListener("click",e=>{
  const cell=e.target.closest("[data-goto]");
  if(cell){setVariant(cell.dataset.goto,"single");return;}
  const demo=e.target.closest("[data-demo]");
  if(demo){e.preventDefault();toast("设计预览：按钮只是示意，不会执行真实写入");}
});
document.addEventListener("keydown",e=>{
  if(mode==="grid"){
    const cell=e.target.closest("[data-goto]");
    if(cell&&(e.key==="Enter"||e.key===" ")){e.preventDefault();setVariant(cell.dataset.goto,"single");return;}
  }
  if(e.key!=="ArrowLeft"&&e.key!=="ArrowRight")return;
  if(/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)||e.target.isContentEditable)return;
  e.preventDefault();step(e.key==="ArrowRight"?1:-1);
});
window.addEventListener("resize",fitMinis);
render();
</script>
</body>
